name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI — Lint, Test & Build"]
    types: [completed]

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ecommerce
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            docker compose exec backend alembic upgrade head
            echo "✅ Deployment complete — $(date)"

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets:
#   DOCKER_USERNAME    — Docker Hub username
#   DOCKER_PASSWORD    — Docker Hub access token
#   SSH_HOST           — Your VPS IP or hostname
#   SSH_USER           — SSH username on VPS
#   SSH_PRIVATE_KEY    — Private SSH key for VPS access
#   VITE_API_URL       — Your backend API URL (e.g. https://api.eshop.com)
#
# Optional (document in README):
#   DATABASE_URL, SECRET_KEY, RAZORPAY_*, MAIL_*, GEMINI_API_KEY, etc.
#   are managed via .env on the VPS, not passed through CI/CD.
# ─────────────────────────────────────────────────────────────────────────────
